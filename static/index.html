<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đặt phòng Mộc Yên Homestay Đà Lạt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .sticky-col-shadow { box-shadow: 3px 0 8px -2px rgba(15, 23, 42, 0.08); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header Bar -->
    <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-3.5 sm:px-6 lg:px-8 py-2.5 sm:py-3.5 flex flex-row items-center justify-between gap-2">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center font-black text-slate-900 text-lg sm:text-xl shadow-lg shadow-teal-500/20 flex-shrink-0">MY</div>
                <div>
                    <h1 class="font-extrabold text-base sm:text-xl tracking-tight text-white flex items-center gap-1.5 leading-tight">
                        Mộc Yên <span class="hidden xs:inline">Homestay</span>
                        <span class="text-[9px] sm:text-[10px] uppercase tracking-wider font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-1.5 sm:px-2 py-0.5 rounded-full">Sale</span>
                    </h1>
                </div>
            </div>
            <div class="flex items-center gap-1.5 sm:gap-2 text-xs">
                <!-- Nút Cài đặt Giá -->
                <button onclick="openSettingsModal()" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-white p-2 sm:px-3 sm:py-2 rounded-xl transition shadow-sm flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span class="hidden sm:inline font-semibold">Cài đặt Giá</span>
                </button>
                <a href="https://zalo.me" target="_blank" class="bg-teal-600 hover:bg-teal-500 active:bg-teal-700 text-white font-medium px-2.5 sm:px-3.5 py-2 rounded-xl transition shadow-sm flex items-center gap-1">
                    <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2.05 21.95l4.902-1.284A9.957 9.957 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2z"/></svg>
                    <span class="hidden sm:inline">Nhóm Zalo</span><span class="sm:hidden">Zalo</span>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-6 sm:space-y-8 flex-1 w-full">
        <!-- Homestay Cards Section -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-3.5 sm:p-6">
            <div class="grid grid-cols-3 gap-2 sm:gap-6" id="homestayCardsContainer"></div>
        </section>

        <!-- Booking Table Section -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-3.5 sm:p-6 overflow-hidden">
            <div class="flex flex-col xl:flex-row xl:items-center justify-between pb-3 sm:pb-4 mb-3 sm:mb-4 border-b border-slate-100 gap-3.5">
                <div>
                    <h2 class="text-base sm:text-lg font-bold text-slate-900 flex items-center gap-2">
                        <svg class="w-5 h-5 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        Bảng theo dõi đặt phòng
                    </h2>
                </div>
                <div class="flex flex-col sm:flex-row items-center gap-2.5 sm:gap-4 w-full xl:w-auto justify-between xl:justify-end">
                    <div class="flex items-center bg-slate-100/90 p-1 rounded-xl border border-slate-200 w-full sm:w-auto justify-between sm:justify-start">
                        <button onclick="prevMonth()" class="p-1.5 sm:p-2 bg-white hover:bg-slate-50 rounded-lg transition active:scale-95"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg></button>
                        <div class="px-2 sm:px-4 font-bold text-sm text-slate-800 min-w-[120px] text-center" id="monthYearLabel">...</div>
                        <button onclick="nextMonth()" class="p-1.5 sm:p-2 bg-white hover:bg-slate-50 rounded-lg transition active:scale-95"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg></button>
                        <button onclick="goToCurrentMonth()" class="px-2.5 py-1.5 sm:px-3 sm:py-2 text-[11px] sm:text-xs font-bold bg-white border border-slate-200 rounded-lg shadow-sm hover:bg-slate-50 text-teal-700 active:scale-95 ml-1 sm:ml-2">Hôm nay</button>
                    </div>
                </div>
            </div>

            <div class="overflow-x-auto rounded-xl border border-slate-200 -mx-1 sm:mx-0 relative">
                <div id="loadingOverlay" class="absolute inset-0 bg-white/60 backdrop-blur-sm z-40 flex items-center justify-center hidden">
                    <svg class="w-8 h-8 text-teal-600 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                </div>
                <table class="w-full text-left text-slate-700 border-collapse min-w-[420px] sm:min-w-full relative">
                    <thead class="uppercase bg-slate-100/95 border-b border-slate-200 sticky top-0 z-20" id="tableHeader">
                        <!-- Rendered via JS -->
                    </thead>
                    <tbody id="bookingTableBody" class="divide-y divide-slate-200 bg-white">
                        <!-- Rendered via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal Chọn trạng thái -->
    <div id="statusModal" onclick="handleBackdropClick(event, 'statusModal')" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden opacity-0 transition-all duration-200">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl max-w-sm w-full p-5 sm:p-6 transform translate-y-full sm:translate-y-0 sm:scale-95 transition-all duration-200 relative">
            <button onclick="closeModal('statusModal')" class="absolute top-4 right-4 text-slate-400 p-2 rounded-full hover:bg-slate-100"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            <div class="text-center mb-5">
                <h3 class="text-base font-bold text-slate-900" id="statusModalTitle">Phòng</h3>
                <p class="text-xs font-semibold text-teal-600 mt-0.5" id="statusModalSubtitle">Ngày</p>
            </div>
            <div class="space-y-2.5">
                <button onclick="setStatus('booked')" class="w-full p-3.5 rounded-2xl border-2 border-rose-500 bg-rose-50 text-rose-800 font-bold flex items-center justify-between shadow-sm active:scale-[0.99]"><div class="flex items-center gap-3"><span class="w-4 h-4 rounded-full bg-rose-600"></span><span class="text-sm">Đã có khách (Đỏ)</span></div></button>
                <button onclick="setStatus('reserved')" class="w-full p-3.5 rounded-2xl border-2 border-amber-400 bg-amber-50 text-amber-900 font-bold flex items-center justify-between shadow-sm active:scale-[0.99]"><div class="flex items-center gap-3"><span class="w-4 h-4 rounded-full bg-amber-400"></span><span class="text-sm">Giữ chỗ (Vàng)</span></div></button>
                <button onclick="setStatus('')" class="w-full p-3.5 rounded-2xl border border-slate-200 bg-slate-50 text-slate-700 font-semibold flex items-center justify-between active:scale-[0.99]"><div class="flex items-center gap-3"><span class="w-4 h-4 rounded-full bg-white border border-slate-300"></span><span class="text-sm">Trống / Hủy chọn</span></div></button>
            </div>
        </div>
    </div>

    <!-- Modal Cài đặt Giá -->
    <div id="settingsModal" onclick="handleBackdropClick(event, 'settingsModal')" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-all duration-200">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 transform scale-95 transition-all duration-200 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal('settingsModal')" class="absolute top-4 right-4 text-slate-400 p-2 rounded-full hover:bg-slate-100"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            <h3 class="text-lg font-bold text-slate-900 mb-4">Cài đặt Giá phòng</h3>
            
            <div class="border-b border-slate-200 mb-4 flex gap-4">
                <button onclick="switchTab('base')" id="tabBase" class="pb-2 font-bold text-teal-600 border-b-2 border-teal-600 text-sm">Giá Cơ Bản</button>
                <button onclick="switchTab('special')" id="tabSpecial" class="pb-2 font-semibold text-slate-500 hover:text-slate-700 text-sm">Giá Lễ / Cuối Tuần</button>
            </div>

            <!-- Tab Giá Cơ Bản -->
            <div id="contentBase" class="space-y-4">
                <div class="space-y-3" id="basePriceForm"></div>
                <button onclick="saveAllBasePrices()" class="w-full bg-teal-600 text-white font-bold py-2.5 rounded-xl hover:bg-teal-500">Lưu Giá Cơ Bản</button>
            </div>

            <!-- Tab Giá Ngày Lễ -->
            <div id="contentSpecial" class="space-y-4 hidden">
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-3">
                    <p class="text-xs font-bold text-slate-700 uppercase">Thêm giá ngày đặc biệt</p>
                    <select id="spRoom" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white">
                        <option value="mocYen">Mộc Yên</option>
                        <option value="soc">Sóc</option>
                        <option value="mocLam">Mộc Lam</option>
                    </select>
                    <input type="date" id="spDate" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white">
                    <input type="number" id="spPrice" placeholder="Nhập giá (VD: 3000000)" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white">
                    <button onclick="saveSpecialPrice()" class="w-full bg-rose-600 text-white font-bold py-2 rounded-lg hover:bg-rose-500 text-sm">Cập nhật Giá Lễ</button>
                </div>
                <p class="text-[11px] text-slate-500 text-center italic">Lưu ý: Giá lễ sẽ đè lên giá cơ bản của ngày đó. Để xóa, hãy lưu giá bằng 0.</p>
            </div>
        </div>
    </div>

    <!-- Modal Xem Ảnh -->
    <div id="imageModal" onclick="handleBackdropClick(event, 'imageModal')" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-2 sm:p-4 hidden opacity-0 transition-opacity duration-200 select-none">
        <div class="bg-slate-900 rounded-2xl sm:rounded-3xl overflow-hidden shadow-2xl max-w-4xl w-full max-h-[95vh] sm:max-h-[92vh] flex flex-col transform scale-95 transition-transform duration-200 relative" id="imageModalContent">
            <button onclick="closeModal('imageModal')" class="absolute top-3 right-3 z-20 w-10 h-10 rounded-full bg-slate-800/80 text-white flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            <div class="flex-1 overflow-hidden flex items-center justify-center p-2 sm:p-4 bg-slate-950/70 min-h-[350px] relative">
                <button onclick="prevLightboxImage()" class="absolute left-2 sm:left-5 z-10 w-10 h-10 rounded-full bg-slate-900/80 text-white flex items-center justify-center"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg></button>
                <img id="enlargedImg" src="" class="max-h-[60vh] sm:max-h-[65vh] w-auto object-contain rounded-xl">
                <button onclick="nextLightboxImage()" class="absolute right-2 sm:right-5 z-10 w-10 h-10 rounded-full bg-slate-900/80 text-white flex items-center justify-center"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg></button>
            </div>
        </div>
    </div>

    <script>
        let currentRealDate = new Date();
        let displayYear = currentRealDate.getFullYear();
        let displayMonth = currentRealDate.getMonth() + 1;
        let bookingState = {}; 
        let basePrices = { mocYen: 2000000, soc: 1500000, mocLam: 1500000 };
        let specialPrices = {};
        let selectedCell = null;
        let activeGalleryRoomKey = 'mocYen';
        let currentImageIndex = 0;

        const ROOM_GALLERIES = {
            mocYen: { key: 'mocYen', name: 'Mộc Yên', pax: '4 - max 12 pax', images: ['anh/moc_yen/1.png', 'anh/moc_yen/2.png', 'anh/moc_yen/3.png', 'anh/moc_yen/4.png'], fallbacks: ['https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1200&q=80'] },
            soc: { key: 'soc', name: 'Sóc', pax: '4 - max 8 pax', images: ['anh/sooc/1.png', 'anh/sooc/2.png', 'anh/sooc/3.png', 'anh/sooc/4.png'], fallbacks: ['https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80'] },
            mocLam: { key: 'mocLam', name: 'Mộc Lam', pax: '4 - max 8 pax', images: ['anh/moc_lam/1.png', 'anh/moc_lam/2.png'], fallbacks: ['https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1200&q=80'] }
        };

        function formatCurrency(amount) {
            return new Intl.NumberFormat('vi-VN').format(amount);
        }

        async function fetchAllData() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
            try {
                const [bookRes, priceRes] = await Promise.all([
                    fetch(`/api/bookings?year=${displayYear}&month=${displayMonth}`),
                    fetch(`/api/prices?year=${displayYear}&month=${displayMonth}`)
                ]);
                if (bookRes.ok) bookingState = await bookRes.json();
                if (priceRes.ok) {
                    const pData = await priceRes.json();
                    if(pData.basePrices) basePrices = {...basePrices, ...pData.basePrices};
                    if(pData.specialPrices) specialPrices = pData.specialPrices;
                }
            } catch (error) { console.error("Lỗi:", error); }
            finally { document.getElementById('loadingOverlay').classList.add('hidden'); }
        }

        async function updateMonthUI() {
            document.getElementById('monthYearLabel').textContent = `Tháng ${displayMonth} / ${displayYear}`;
            await fetchAllData();
            renderHomestayCards(); // Update prices on cards
            renderTable();
        }

        function prevMonth() { displayMonth--; if (displayMonth < 1) { displayMonth = 12; displayYear--; } updateMonthUI(); }
        function nextMonth() { displayMonth++; if (displayMonth > 12) { displayMonth = 1; displayYear++; } updateMonthUI(); }
        function goToCurrentMonth() { const now = new Date(); displayYear = now.getFullYear(); displayMonth = now.getMonth() + 1; updateMonthUI(); }

        function renderTable() {
            // Render Header with dynamic Base Prices
            const thead = document.getElementById('tableHeader');
            thead.innerHTML = `
                <tr>
                    <th class="py-2 px-1.5 sm:py-3 sm:px-4 w-20 sm:w-36 border-r border-slate-200 text-center font-extrabold text-slate-800 sticky left-0 z-30 bg-slate-100 whitespace-nowrap text-[10px] sm:text-xs">Thứ/Ngày</th>
                    <th class="py-2 px-1.5 sm:py-3 sm:px-4 text-center border-r border-slate-200 font-extrabold text-rose-700 bg-rose-50/70 whitespace-nowrap text-[11px] sm:text-xs">Mộc Yên <span class="block text-[9px] sm:text-[11px] font-normal text-slate-500 normal-case mt-0.5">${formatCurrency(basePrices['mocYen'])} đ</span></th>
                    <th class="py-2 px-1.5 sm:py-3 sm:px-4 text-center border-r border-slate-200 font-extrabold text-teal-700 bg-teal-50/70 whitespace-nowrap text-[11px] sm:text-xs">Sóc <span class="block text-[9px] sm:text-[11px] font-normal text-slate-500 normal-case mt-0.5">${formatCurrency(basePrices['soc'])} đ</span></th>
                    <th class="py-2 px-1.5 sm:py-3 sm:px-4 text-center font-extrabold text-sky-700 bg-sky-50/70 whitespace-nowrap text-[11px] sm:text-xs">Mộc Lam <span class="block text-[9px] sm:text-[11px] font-normal text-slate-500 normal-case mt-0.5">${formatCurrency(basePrices['mocLam'])} đ</span></th>
                </tr>`;

            const tbody = document.getElementById('bookingTableBody');
            tbody.innerHTML = '';
            const daysInMonth = new Date(displayYear, displayMonth, 0).getDate();
            const dayNames = ['Chủ Nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];

            for (let i = 1; i <= daysInMonth; i++) {
                const currentDateLoop = new Date(displayYear, displayMonth - 1, i);
                const dayOfWeek = currentDateLoop.getDay();
                const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                const isToday = (displayYear === currentRealDate.getFullYear() && displayMonth === currentRealDate.getMonth() + 1 && i === currentRealDate.getDate());

                const tr = document.createElement('tr');
                tr.className = `transition border-b border-slate-200 group ${isToday ? 'bg-teal-50/40' : 'hover:bg-slate-50'}`;

                const dayTd = document.createElement('td');
                dayTd.className = `py-2 px-1.5 sm:py-3 sm:px-4 border-r border-slate-200 font-bold sticky left-0 z-10 sticky-col-shadow whitespace-nowrap ${isToday ? 'bg-teal-50 text-teal-700' : (isWeekend ? 'bg-rose-50 text-rose-600' : 'bg-white text-slate-800')}`;
                dayTd.innerHTML = `<div class="flex items-center justify-center whitespace-nowrap"><span class="text-[10px] sm:text-sm">${dayNames[dayOfWeek]}</span><span class="ml-1 sm:ml-1.5 px-1 py-0.5 rounded ${isToday ? 'bg-teal-500 text-white' : 'bg-slate-200/80'} text-[9px] sm:text-xs">${i}</span></div>`;
                tr.appendChild(dayTd);

                ['mocYen', 'soc', 'mocLam'].forEach(roomKey => {
                    const stateKey = `${displayYear}_${displayMonth}_${i}_${roomKey}`;
                    const status = bookingState[stateKey];
                    const activePrice = specialPrices[stateKey] || basePrices[roomKey];
                    const isSpecial = !!specialPrices[stateKey];

                    const td = document.createElement('td');
                    td.className = 'py-2.5 px-1.5 sm:py-3.5 sm:px-4 text-center border-r border-slate-200 cursor-pointer font-bold text-[11px] sm:text-sm active:scale-[0.98] whitespace-nowrap relative';
                    
                    if (status === 'booked') {
                        td.className += ' bg-rose-600 text-white shadow-inner';
                        td.innerHTML = formatCurrency(activePrice);
                    } else if (status === 'reserved') {
                        td.className += ' bg-amber-400 text-slate-900 shadow-inner font-extrabold';
                        td.textContent = 'GIỮ CHỖ';
                    } else {
                        if (isSpecial) {
                            td.className += ' text-purple-700 bg-purple-50/50';
                            td.innerHTML = `${formatCurrency(activePrice)}<span class="absolute top-0.5 right-1 text-[8px] text-purple-500">Lễ</span>`;
                        } else {
                            td.textContent = formatCurrency(activePrice);
                        }
                    }
                    td.onclick = () => openStatusModal(i, roomKey);
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            }
        }

        // --- HOMESTAY CARDS RENDER ---
        function renderHomestayCards() {
            const container = document.getElementById('homestayCardsContainer');
            if (!container) return;
            container.innerHTML = '';
            Object.keys(ROOM_GALLERIES).forEach(roomKey => {
                const room = ROOM_GALLERIES[roomKey];
                const coverImg = room.images.length > 0 ? room.images[0] : room.fallbacks[0];
                const currentBasePrice = basePrices[roomKey];
                
                const cardHtml = `
                    <div class="bg-white rounded-2xl overflow-hidden border border-slate-200 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col">
                        <div class="px-2 sm:px-4 py-2 sm:py-3 bg-slate-50 border-b border-slate-100">
                            <h3 class="font-extrabold text-xs sm:text-base text-slate-900 whitespace-nowrap truncate text-center w-full">${room.name}</h3>
                        </div>
                        <div class="h-28 sm:h-48 overflow-hidden relative cursor-pointer group" onclick="openImageModal('${roomKey}', 0)">
                            <img src="${coverImg}" onerror="this.onerror=null; this.src='${room.fallbacks[0]}';" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                            <div class="absolute bottom-2 left-2 sm:bottom-3 sm:left-3 z-10">
                                <span class="text-[9px] sm:text-[11px] font-bold text-white bg-slate-900/70 backdrop-blur-md px-2 py-1 rounded-lg border border-white/20 shadow-md">${room.pax}</span>
                            </div>
                        </div>
                        <div class="p-2 sm:p-4 flex flex-col gap-1.5 sm:gap-3 bg-white">
                            <div class="text-center">
                                <p class="text-[8px] sm:text-[10px] text-slate-400 font-extrabold uppercase tracking-wider mb-0.5">Giá Cơ Bản</p>
                                <p class="text-xs sm:text-xl font-black text-rose-600 leading-tight">${formatCurrency(currentBasePrice)}đ</p>
                            </div>
                        </div>
                    </div>`;
                container.innerHTML += cardHtml;
            });
        }

        // --- SETTINGS MODAL LOGIC ---
        function openSettingsModal() {
            document.getElementById('basePriceForm').innerHTML = Object.keys(ROOM_GALLERIES).map(key => `
                <div class="flex items-center justify-between bg-white p-2 rounded border border-slate-200">
                    <span class="font-bold text-sm text-slate-700 w-24">${ROOM_GALLERIES[key].name}</span>
                    <input type="number" id="base_${key}" value="${basePrices[key]}" class="border border-slate-300 rounded p-1.5 text-sm w-full text-right" />
                </div>
            `).join('');

            const modal = document.getElementById('settingsModal');
            document.body.classList.add('overflow-hidden');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); modal.children[0].classList.remove('scale-95'); }, 10);
        }

        function switchTab(tab) {
            if (tab === 'base') {
                document.getElementById('tabBase').className = "pb-2 font-bold text-teal-600 border-b-2 border-teal-600 text-sm";
                document.getElementById('tabSpecial').className = "pb-2 font-semibold text-slate-500 hover:text-slate-700 text-sm";
                document.getElementById('contentBase').classList.remove('hidden');
                document.getElementById('contentSpecial').classList.add('hidden');
            } else {
                document.getElementById('tabSpecial').className = "pb-2 font-bold text-teal-600 border-b-2 border-teal-600 text-sm";
                document.getElementById('tabBase').className = "pb-2 font-semibold text-slate-500 hover:text-slate-700 text-sm";
                document.getElementById('contentSpecial').classList.remove('hidden');
                document.getElementById('contentBase').classList.add('hidden');
            }
        }

        async function saveAllBasePrices() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
            closeModal('settingsModal');
            try {
                for (let key of Object.keys(ROOM_GALLERIES)) {
                    let newPrice = parseInt(document.getElementById(`base_${key}`).value);
                    if (newPrice && newPrice !== basePrices[key]) {
                        await fetch('/api/prices', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ type: 'base', roomKey: key, price: newPrice })
                        });
                    }
                }
                updateMonthUI();
            } catch (e) { alert('Lỗi khi lưu!'); }
        }

        async function saveSpecialPrice() {
            const roomKey = document.getElementById('spRoom').value;
            const dateStr = document.getElementById('spDate').value;
            const price = parseInt(document.getElementById('spPrice').value) || 0;

            if (!dateStr) return alert("Vui lòng chọn ngày!");
            document.getElementById('loadingOverlay').classList.remove('hidden');
            closeModal('settingsModal');

            try {
                const reqType = price > 0 ? 'special' : 'delete_special';
                await fetch('/api/prices', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: reqType, roomKey: roomKey, date: dateStr, price: price })
                });
                updateMonthUI();
                document.getElementById('spPrice').value = '';
            } catch (e) { alert('Lỗi khi lưu!'); document.getElementById('loadingOverlay').classList.add('hidden');}
        }

        // --- MODAL UTILS ---
        function openStatusModal(dateNum, roomKey) {
            selectedCell = { dateNum, roomKey };
            document.getElementById('statusModalTitle').textContent = `${ROOM_GALLERIES[roomKey].name}`;
            document.getElementById('statusModalSubtitle').textContent = `Ngày ${dateNum}/${displayMonth}/${displayYear}`;
            const modal = document.getElementById('statusModal');
            document.body.classList.add('overflow-hidden');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); modal.children[0].classList.remove('translate-y-full', 'sm:scale-95'); }, 10);
        }

        function openImageModal(roomKey, startIndex) {
            activeGalleryRoomKey = roomKey; currentImageIndex = startIndex;
            document.getElementById('enlargedImg').src = ROOM_GALLERIES[roomKey].images[startIndex] || ROOM_GALLERIES[roomKey].fallbacks[0];
            const modal = document.getElementById('imageModal');
            document.body.classList.add('overflow-hidden');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); modal.children[0].classList.remove('scale-95'); }, 10);
        }

        function prevLightboxImage() {
            let imgs = ROOM_GALLERIES[activeGalleryRoomKey].images;
            currentImageIndex = (currentImageIndex - 1 + imgs.length) % imgs.length;
            document.getElementById('enlargedImg').src = imgs[currentImageIndex];
        }
        function nextLightboxImage() {
            let imgs = ROOM_GALLERIES[activeGalleryRoomKey].images;
            currentImageIndex = (currentImageIndex + 1) % imgs.length;
            document.getElementById('enlargedImg').src = imgs[currentImageIndex];
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.add('opacity-0');
            if (modal.children[0].classList.contains('translate-y-0')) {
                modal.children[0].classList.add('translate-y-full', 'sm:scale-95');
            } else {
                modal.children[0].classList.add('scale-95');
            }
            setTimeout(() => { modal.classList.add('hidden'); document.body.classList.remove('overflow-hidden'); }, 200);
        }

        function handleBackdropClick(e, modalId) { if (e.target.id === modalId) closeModal(modalId); }

        async function setStatus(statusType) {
            if (!selectedCell) return;
            const fmtMonth = String(displayMonth).padStart(2, '0');
            const fmtDate = String(selectedCell.dateNum).padStart(2, '0');
            const sqlDateString = `${displayYear}-${fmtMonth}-${fmtDate}`;
            const stateKey = `${displayYear}_${displayMonth}_${selectedCell.dateNum}_${selectedCell.roomKey}`;

            document.getElementById('loadingOverlay').classList.remove('hidden');
            closeModal('statusModal');

            try {
                const response = await fetch('/api/bookings', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roomKey: selectedCell.roomKey, date: sqlDateString, status: statusType })
                });

                if(response.ok) {
                    if (statusType) bookingState[stateKey] = statusType;
                    else delete bookingState[stateKey];
                    renderTable();
                } else alert('Lỗi khi lưu!');
            } catch (error) { alert('Lỗi mạng!'); } 
            finally { document.getElementById('loadingOverlay').classList.add('hidden'); }
        }

        window.onload = updateMonthUI;
    </script>
</body>
</html>
